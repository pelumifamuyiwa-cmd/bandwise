<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bandwise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: three-column app shell (rail, learning path, stats) on desktop; top chips + tab bar on phones. Lessons run full-screen with a pinned action bar. Exam = brand colour, skill = lesson colour. */
:root{
  --bg:#f3f5fb;--surface:#ffffff;--ink:#1d2236;--mut:#657090;--line:#e1e5f1;
  --brand:#2f6bff;--brand-d:#1f4fc4;
  --c:var(--brand);--cd:var(--brand-d);
  --good:#1f9d57;--bad:#e03e45;--gold:#ffb21e;--gold-d:#d99410;--flame:#ff7a1a;
  --disp:'Fredoka','Nunito',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light}
:root[data-exam="IELTS"]{--brand:#e5334b;--brand-d:#b61f35}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bg:#0d1120;--surface:#171c2f;--ink:#eef0f9;--mut:#9ba5c6;--line:#283049;--brand:#5b8cff;--brand-d:#3a63cc;--good:#3ddc84;--bad:#ff6b70;--gold:#ffc24a;--gold-d:#c8901b;color-scheme:dark}
:root:not([data-theme="light"])[data-exam="IELTS"]{--brand:#ff5a6e;--brand-d:#c93a4c}}
:root[data-theme="dark"]{--bg:#0d1120;--surface:#171c2f;--ink:#eef0f9;--mut:#9ba5c6;--line:#283049;--brand:#5b8cff;--brand-d:#3a63cc;--good:#3ddc84;--bad:#ff6b70;--gold:#ffc24a;--gold-d:#c8901b;color-scheme:dark}
:root[data-theme="dark"][data-exam="IELTS"]{--brand:#ff5a6e;--brand-d:#c93a4c}
[data-skill="listening"]{--sk:#1fa4ee;--sk-d:#1480b9;--c:var(--sk);--cd:var(--sk-d)}
[data-skill="reading"]{--sk:#8b5cf6;--sk-d:#6a3fd1;--c:var(--sk);--cd:var(--sk-d)}
[data-skill="writing"]{--sk:#ff7a3d;--sk-d:#d65a22;--c:var(--sk);--cd:var(--sk-d)}
[data-skill="speaking"]{--sk:#14b58d;--sk-d:#0e8c6d;--c:var(--sk);--cd:var(--sk-d)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--disp);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.15}h2{font-size:21px;line-height:1.25}h3{font-size:18px}
p{margin:0}
.muted{color:var(--mut);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
svg.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic.f{fill:currentColor;stroke:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 65%,#fff);outline-offset:2px}
.fl{color:var(--flame)}.gd{color:var(--gold)}

/* app shell */
.app{display:grid;grid-template-columns:232px minmax(0,580px) 320px;gap:24px;justify-content:center;max-width:1200px;margin:0 auto;align-items:start}
.rail{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:6px;padding:16px 0}
.logo{display:flex;align-items:center;gap:8px;padding:0 10px 14px;font:700 27px var(--disp);color:var(--brand)}
.logo svg.bandy{width:40px;height:40px}
.rn{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;border:2px solid transparent;background:none;color:var(--mut);font:700 16px var(--body);text-align:left;width:100%}
.rn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.rn.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface));border-color:color-mix(in srgb,var(--brand) 50%,transparent)}
.center{min-width:0;padding:16px 0 110px}
.side{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:14px;padding:16px 0}
.tb{display:none;align-items:center;gap:8px;margin-bottom:14px}
.tb .sp,.sk-row .sp{flex:1}
.only-m{display:none}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:2px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));justify-content:space-around;gap:4px}
.bnav button{flex:1;border:2px solid transparent;background:none;border-radius:12px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font:700 12px var(--body);color:var(--mut)}
.bnav button.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface));border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
@media (max-width:1100px){
.app{grid-template-columns:72px minmax(0,640px)}
.side{display:none}.rn span,.logo span{display:none}.rn{justify-content:center;padding:12px}.logo{padding:0 0 14px;justify-content:center}
.tb{display:flex}.only-m{display:block}}
@media (max-width:760px){
.app{grid-template-columns:minmax(0,1fr)}.rail{display:none}.bnav{display:flex}.center{padding-top:12px}h1{font-size:26px}}

/* chips and cards */
.chipx{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:600 17px var(--disp);color:var(--ink);font-variant-numeric:tabular-nums}
.chipx svg.ic{width:20px;height:20px}
button.chipx:hover{border-color:var(--brand)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gbar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s;position:relative}
.gbar i::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:3px;border-radius:3px;background:rgba(255,255,255,.45)}
.sk-row{display:flex;gap:8px}
.wk{display:flex;justify-content:space-between;gap:4px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 12px var(--body);color:var(--mut)}
.wk i{width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff}
.wk i.on{background:var(--flame)}
.wk i svg{width:15px;height:15px}
.big{font:600 34px/1 var(--disp)}
.note{background:color-mix(in srgb,var(--gold) 18%,var(--surface));border:2px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:14px}

/* buttons */
.btn{--c:var(--brand);--cd:var(--brand-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;background:var(--c);color:#fff;font:700 16px/1.1 var(--body);box-shadow:0 4px 0 var(--cd);transition:transform .06s,box-shadow .06s;min-height:50px}
[data-skill] .btn,.abar .btn{--c:var(--sk,var(--brand));--cd:var(--sk-d,var(--brand-d))}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--cd)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--line),0 4px 0 2px var(--line)}
.btn.ghost:active{box-shadow:0 0 0 2px var(--line),0 0 0 2px var(--line)}
.btn.sm{padding:9px 14px;min-height:40px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{background:var(--line);color:var(--mut);box-shadow:none;cursor:not-allowed;transform:none}
.sub{color:var(--mut);margin-top:4px}

/* learning path */
.unit{margin-bottom:6px}
.uh{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:6;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--sk);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 var(--sk-d)}
.uh small{font-weight:700;opacity:.92;font-size:13px}
.uh h2{color:#fff;font-size:22px}
.uh p{font-size:13px;opacity:.95;font-weight:600}
.uh .tipb{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);color:#fff;border-radius:12px;padding:9px 12px;font:700 14px var(--body);display:flex;gap:6px;align-items:center;flex:none}
.path{display:flex;flex-direction:column;align-items:center;gap:46px;padding:48px 0 40px}
.pn{display:flex;flex-direction:column;align-items:center;gap:8px;width:180px;text-align:center;transform:translateX(var(--dx,0px))}
.nw{position:relative}
.node{width:80px;height:80px;border-radius:50%;border:0;background:var(--sk);box-shadow:0 7px 0 var(--sk-d);display:grid;place-items:center;color:#fff;position:relative;transition:transform .08s,box-shadow .08s}
.node svg.ic{width:34px;height:34px;stroke-width:2.2}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sk-d)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.done:active{box-shadow:0 2px 0 var(--gold-d)}
.node.next::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid color-mix(in srgb,var(--sk) 28%,transparent);pointer-events:none}
.bub{position:absolute;bottom:calc(100% + 18px);left:50%;translate:-50% 0;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 14px;font:600 16px var(--disp);color:var(--ink);white-space:nowrap;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-6px)}}
.cap{font:700 14px/1.25 var(--body);color:var(--mut)}
.stars{display:flex;gap:2px}.stars svg{width:16px;height:16px}
.stars svg.off{color:var(--line)}.stars svg.on{color:var(--gold)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(520px,100%);border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out;max-height:92%;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:24px}}
.sh-h{display:flex;gap:14px;align-items:center}
.badge-sk{width:54px;height:54px;border-radius:50%;background:var(--sk,var(--brand));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 var(--sk-d,var(--brand-d))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:700 13px var(--body);padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--ink) 7%,var(--surface));color:var(--mut)}
.chip.gold{background:color-mix(in srgb,var(--gold) 22%,var(--surface));color:var(--ink)}
.pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--surface);font-weight:700}
.pick:hover{background:color-mix(in srgb,var(--brand) 6%,var(--surface))}
.pick.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.pick small{display:block;color:var(--mut);font-weight:600}
.pick b{font:600 19px var(--disp)}
.pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.pgrid2 .pick{flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 6px}

/* practice */
.pt{margin-bottom:6px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0 14px}
.ptile{border:0;border-radius:20px;background:var(--sk);color:#fff;padding:18px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;box-shadow:0 5px 0 var(--sk-d);text-align:left;min-height:132px;transition:transform .06s,box-shadow .06s}
.ptile:active{transform:translateY(5px);box-shadow:0 0 0 var(--sk-d)}
.ptile .pi{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;margin-bottom:6px}
.ptile b{font:600 20px var(--disp)}.ptile small{font-weight:700;opacity:.95}
.stack{display:flex;flex-direction:column;gap:12px}

/* progress and profile */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal i{aspect-ratio:1;border-radius:8px;background:var(--line);display:block}
.cal i.l1{background:color-mix(in srgb,var(--flame) 35%,var(--surface))}
.cal i.l2{background:color-mix(in srgb,var(--flame) 65%,var(--surface))}
.cal i.l3{background:var(--flame)}
.cal i.f{background:none}.cal i.t{outline:2px solid var(--ink);outline-offset:1px}
.cal b{text-align:center;font:700 12px var(--body);color:var(--mut)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scard{display:flex;flex-direction:column;gap:6px}
.scard .hd{display:flex;align-items:center;gap:10px}
.scard .badge-sk{width:38px;height:38px;box-shadow:none}
.scard .badge-sk svg.ic{width:20px;height:20px}
.spark{width:100%;height:34px;color:var(--sk)}
.tgt{display:flex;flex-direction:column;gap:12px}
.tgt .row{display:grid;grid-template-columns:86px 1fr 44px;gap:10px;align-items:center;font-weight:700;font-size:14px}
.tgt .tr{position:relative;height:14px;background:var(--line);border-radius:99px}
.tgt .tr i{display:block;height:100%;border-radius:99px;background:var(--sk)}
.tgt .tr s{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px;text-decoration:none}
.bars .row{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;font-weight:700;font-size:14px}
.bars .tr{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bars .tr i{display:block;height:100%;background:var(--brand);border-radius:99px}
.prow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:2px solid var(--line)}
.prow:first-of-type{border-top:0}
.setrow{display:flex;flex-direction:column;gap:10px}
.setrow>b{font:600 17px var(--disp)}
.date{padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:600 16px var(--body);width:100%}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.sw input{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--good)}.sw input:checked::after{transform:translateX(22px)}

/* lesson */
.lesson{max-width:1080px;margin:0 auto;padding-bottom:170px}
.lh{display:flex;align-items:center;gap:14px;padding:14px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.x{border:0;background:none;color:var(--mut);padding:6px;border-radius:10px;display:grid;place-items:center}
.x:hover{color:var(--ink)}
.pbar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sk);border-radius:99px;transition:width .35s;position:relative;min-width:0}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.38)}
.tchip{display:flex;gap:6px;align-items:center;font:600 18px var(--disp);font-variant-numeric:tabular-nums;color:var(--mut);background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:3px 12px}
.tchip svg.ic{width:18px;height:18px}
.timer.warn,.tchip:has(.warn){color:var(--bad);border-color:var(--bad)}
.lsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.seg{display:none;gap:6px;padding:5px;background:var(--surface);border:2px solid var(--line);border-radius:14px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--sk);color:#fff}
.pcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.ppane .pcard{max-height:calc(100vh - 250px);overflow:auto}
.passage{font-size:17px;line-height:1.7;white-space:pre-wrap}
.qpane{padding:6px 2px;display:flex;flex-direction:column}
.qmeta{font-weight:700;color:var(--mut);font-size:14px;margin-bottom:6px}
.qtext{font:600 23px/1.3 var(--disp);margin-bottom:8px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);margin-top:10px;font-weight:600;color:var(--ink)}
.opt:hover:not(:disabled){background:color-mix(in srgb,var(--sk) 8%,var(--surface))}
.opt .k{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font:700 13px var(--body);flex:none;color:var(--mut)}
.opt.sel{border-color:var(--sk);background:color-mix(in srgb,var(--sk) 14%,var(--surface))}
.opt.sel .k{background:var(--sk);border-color:var(--sk);color:#fff}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fill{width:100%;margin-top:12px;padding:16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--ink);font:600 18px var(--body)}
.fill:focus{outline:0;border-color:var(--sk)}
.player{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.playbtn{width:76px;height:76px;border-radius:50%;border:0;background:var(--sk);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--sk-d)}
.playbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sk-d)}
.playbtn:disabled{opacity:.55}
.playbtn svg.ic{width:30px;height:30px;fill:currentColor;stroke:none}
.eq{display:flex;gap:4px;align-items:flex-end;height:34px}.eq i{width:5px;height:7px;background:var(--line);border-radius:3px}
.live .eq i{background:var(--sk);animation:eq 1s ease-in-out infinite}
.live .eq i:nth-child(2){animation-delay:.15s}.live .eq i:nth-child(3){animation-delay:.3s}.live .eq i:nth-child(4){animation-delay:.45s}.live .eq i:nth-child(5){animation-delay:.6s}
@keyframes eq{50%{height:32px}}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.abar.ok{background:color-mix(in srgb,var(--good) 16%,var(--surface));border-color:transparent}
.abar.no{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:transparent}
.abar.ok .btn{--c:var(--good);--cd:color-mix(in srgb,var(--good) 68%,#000)}
.abar.no .btn{--c:var(--bad);--cd:color-mix(in srgb,var(--bad) 68%,#000)}
.ab-in{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px}
.fb-t{display:flex;gap:12px;align-items:flex-start;font-size:15px;min-width:0}
.abar.ok .fb-t{color:var(--good)}.abar.no .fb-t{color:var(--bad)}

/* ---------- generation ---------- */
function pickTopic(){const c=TOPICS.filter(t=>!S.recent.includes(t));const t=rnd(c.length?c:TOPICS);S.recent=[...S.recent,t].slice(-8);return t;}
async function serverJSON(prompt){
  let r;const ac=new AbortController();setTimeout(()=>ac.abort(),25000);try{r=await fetch('/api/claude',{signal:ac.signal,method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});}catch(e){throw {code:'network'};}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw {code:d.code||'server'};
  const m=String(d.text||'').match(/\{[\s\S]*\}/);if(!m)throw {code:'parse'};return JSON.parse(m[0]);
}
async function askJSON(prompt,opts){
  if(!sampleFn)return serverJSON(prompt);
  opts=Object.assign({cache:false},opts||{});
  try{const r=await sampleFn.json(prompt,opts);if(r&&typeof r==='object')return r;}catch(e){if(e&&(e.code==='not_granted'||e.code==='rate_limited'))throw e;}
  const t=await sampleFn(prompt,opts);const m=String(t.text||'').match(/\{[\s\S]*\}/);if(!m)throw {code:'parse'};return JSON.parse(m[0]);
}
const QSPEC='"questions":[{"type":"mcq"|"tfng"|"fill","q":string,"options":[4 strings, mcq only],"answer":string (mcq: letter A-D; tfng: True|False|Not Given; fill: the answer, max 3 words, digits for numbers),"alt":[accepted alternative answers],"why":string (one sentence citing the text),"skill":one of "main idea","detail","inference","opinion/attitude","numbers/dates","spelling","vocabulary","not given"}]';

    const j=await askJSON(`You are an exam item writer for ${style} Writing. Write ONE original practice question.\nTask: ${task.name} - ${task.hint}. Topic area: ${topic}.\nMatch the real exam wording and difficulty. State word expectations (${task.words[0]}-${task.words[1]}+ words).\n${e==='IELTS'&&mod==='Academic'&&task.id==='W1'?'Because charts cannot be drawn, give the figures as a small plain-text table in "data" (3-5 rows, 3-4 columns, realistic numbers) and put the instructions in "prompt".':'Leave "data" as an empty string.'}\nReturn ONLY JSON: {"prompt":string,"data":string}`);

function fallback(task){

function normQ(r){

function speakScript(script,onDone){
  const synth=window.speechSynthesis;if(!synth)return false;synth.cancel();S.stopSpeech=false;
  const vs=synth.getVoices().filter(v=>/^en/i.test(v.lang));const pref=vs.filter(v=>/en[-_](CA|GB|US|AU)/i.test(v.lang));const pool=pref.length?pref:vs;
  const names=[...new Set(script.map(s=>s.speaker))];
  const cfg=names.map((n,i)=>({v:pool.length?pool[(i*2)%pool.length]:null,pitch:[1,.85,1.2][i%3]}));
  const q=[];script.forEach(seg=>{String(seg.text).split(/(?<=[.?!])\s+/).forEach((t,k,a)=>{if(t.trim())q.push({sp:seg.speaker,t,last:k===a.length-1});});});

  const today=dk(Date.now());let s=0;const d=new Date();if(!days[today])d.setDate(d.getDate()-1);

  return {days,total,today:days[today]||0,streak:s,doneToday:!!days[today]};
}
function bestMap(){const m={};mine().forEach(x=>{const k=x.skill+'|'+x.task,lv=lvOf(x);if(!m[k])m[k]={lv,n:1};else{m[k].n++;if(lv>m[k].lv)m[k].lv=lv;}});return m;}
const starsOf=lv=>{const t=P.target[P.exam];return lv>=t?3:lv>=t-1?2:1;};
function daysLeft(){if(!P.date)return null;const d=Math.ceil((new Date(P.date+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5);return isFinite(d)?d:null;}
function bestBySkill(){const o={};SKL.forEach(sk=>{const a=mine().filter(x=>x.skill===sk).map(lvOf);o[sk]=a.length?Math.max(...a):null;});return o;}

/* ---------- views: shell ---------- */
function courseName(){return P.exam==='CELPIP'?'CELPIP':'IELTS '+(P.module==='General'?'GT':'Academic');}
function chips(){const st=stats();return `<button class="chipx" data-act="course" aria-label="Change course"><span class="dot"></span>${esc(courseName())}</button><span class="sp"></span><span class="chipx" title="Day streak">${icf('flame','fl')}${st.streak}</span><span class="chipx" title="XP today">${icf('bolt','gd')}${st.today}</span>`;}
function goalCard(){const st=stats(),g=P.goal,pc=Math.min(100,100*st.today/g);const done=st.today>=g;
  return `<section class="card"><h3>Daily goal <span class="muted">${st.today} / ${g} XP</span></h3><div class="gbar"><i style="width:${pc}%"></i></div><p class="muted">${done?'Goal reached. Anything more is a bonus.':`${g-st.today} XP to go. One lesson usually covers it.`}</p></section>`;}
function streakCard(){const st=stats();const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({k:dk(d.getTime()),n:d.toLocaleDateString(undefined,{weekday:'narrow'})});}

function targetCard(){const t=P.target[P.exam],b=bestBySkill(),vals=Object.values(b).filter(v=>v!=null),dl=daysLeft();

function rail(){const it=[['learn','Learn'],['practice','Practice'],['progress','Progress'],['me','Profile']];
  return `<aside class="rail"><div class="logo">${bandy('happy',40)}<span>Bandwise</span></div>${it.map(([k,n])=>`<button class="rn ${S.tab===k?'on':''}" data-act="tab" data-arg="${k}" aria-label="${n}">${ic(k==='learn'?'learn':k==='practice'?'practice':k==='progress'?'chart':'me')}<span>${n}</span></button>`).join('')}</aside>`;}
function bnav(){const it=[['learn','Learn'],['practice','Practice'],['progress','Progress'],['me','Profile']];
  return `<nav class="bnav" aria-label="Main">${it.map(([k,n])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-arg="${k}">${ic(k==='learn'?'learn':k==='practice'?'practice':k==='progress'?'chart':'me')}${n}</button>`).join('')}</nav>`;}
function viewShell(){

  return `<div class="app">${rail()}<main class="center"><div class="tb">${chips()}</div><div id="capnote"></div>${main}</main><aside class="side"><div class="sk-row">${chips()}</div>${goalCard()}${streakCard()}${targetCard()}</aside></div>${bnav()}`;

/* ---------- views: learn ---------- */
const DX=[0,40,64,40,0,-40,-64,-40];
function tabLearn(){
  const bm=bestMap();let next=null;
  outer:for(const sk of SKL){for(const t of getTasks(sk)){if(!bm[sk+'|'+t.name]){next=sk+'|'+t.name;break outer;}}}
  if(!next)outer2:for(const sk of SKL){for(const t of getTasks(sk)){if(starsOf(bm[sk+'|'+t.name].lv)<3){next=sk+'|'+t.name;break outer2;}}}
  const units=SKL.map((sk,ui)=>{const ts=getTasks(sk);const done=ts.filter(t=>bm[sk+'|'+t.name]).length;
    const nodes=ts.map((t,i)=>{const b=bm[sk+'|'+t.name],isNext=next===sk+'|'+t.name;const st=b?starsOf(b.lv):0;
      return `<div class="pn" style="--dx:${DX[i%8]}px"><div class="nw">${isNext?`<div class="bub">${b?'Try again':'Start'}</div>`:''}<button class="node ${b?'done':''} ${isNext?'next':''}" data-act="open" data-arg="${sk}:${t.id}" aria-label="${esc(t.name)}">${b?ic('check'):ic(sk)}</button></div><div class="cap">${esc(t.name)}</div>${b?`<div class="stars">${[1,2,3].map(n=>`<svg class="ic f ${n<=st?'on':'off'}" viewBox="0 0 24 24" aria-hidden="true">${ICONS.star}</svg>`).join('')}</div>`:''}</div>`;}).join('');
    return `<section class="unit" data-skill="${sk}"><div class="uh"><div><small>Unit ${ui+1} · ${done} of ${ts.length} done</small><h2>${cap(sk)}</h2><p>${SKI[sk]}</p></div><button class="tipb" data-act="tips" data-arg="${sk}">${ic('bulb')}Tips</button></div><div class="path">${nodes}</div></section>`;}).join('');
  return units;
}

/* ---------- views: practice, progress, profile ---------- */

  <div class="stack"><button class="card" data-act="surprise" style="flex-direction:row;align-items:center;gap:14px;text-align:left"><span class="badge-sk" style="--sk:var(--brand);--sk-d:var(--brand-d)">${ic('shuffle')}</span><span><b style="font:600 19px var(--disp)">Surprise me</b><br><span class="muted">Any skill, any task</span></span></button>

function spark(v,w,h){if(v.length<2)return '';w=w||160;h=h||34;const p=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-4-Math.min(1,y)*(h-8)).toFixed(1)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${p}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;}
function tabProgress(){
  const st=stats(),m=mine(),lvl=Math.floor(st.total/150)+1,pg=(st.total%150)/150*100;
  const errs={};hist().forEach(x=>Object.entries(x.err||{}).forEach(([k,n])=>{errs[k]=(errs[k]||0)+n;}));
  const top=Object.entries(errs).sort((a,b)=>b[1]-a[1]).slice(0,6),mx=top.length?top[0][1]:1;
  const today=new Date(),dow=(today.getDay()+6)%7,start=new Date(today);start.setDate(today.getDate()-dow-28);
  const cells=[];for(let i=0;i<35;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=dk(d.getTime());const f=d>today;const x=st.days[k]||0;cells.push(`<i class="${f?'f':x>=50?'l3':x>=20?'l2':x>0?'l1':''} ${k===dk(Date.now())?'t':''}" title="${k}: ${x} XP"></i>`);}
  const best=bestBySkill(),t=P.target[P.exam],mxl=maxLv();
  return `<h1 class="pt">Progress</h1><p class="sub">${hist().length} lessons so far. ${esc(courseName())} results shown below.</p>
  <div class="stack" style="margin-top:16px">
  <section class="card"><h3>Level ${lvl} <span class="muted">${st.total} XP total</span></h3><div class="gbar"><i style="width:${pg}%"></i></div><p class="muted">${150-(st.total%150)} XP to level ${lvl+1}</p></section>
  <section class="card"><h3>Practice calendar <span class="muted">Last 5 weeks</span></h3><div class="cal">${'MTWTFSS'.split('').map(d=>`<b>${d}</b>`).join('')}${cells.join('')}</div></section>
  <section class="card tgt"><h3>Best vs target <span class="muted">${esc(lbl(P.exam,t))}</span></h3>${SKL.map(sk=>`<div class="row" data-skill="${sk}"><span>${cap(sk)}</span><div class="tr"><i style="width:${best[sk]==null?0:100*best[sk]/mxl}%"></i><s style="left:${100*t/mxl}%"></s></div><span>${best[sk]==null?'-':best[sk]}</span></div>`).join('')}<p class="muted">The dark marker is your target.</p></section>
  <div class="sgrid">${SKL.map(sk=>{const a=m.filter(x=>x.skill===sk);const l=a[a.length-1];return `<section class="card scard" data-skill="${sk}"><div class="hd"><span class="badge-sk">${ic(sk)}</span><div><b>${cap(sk)}</b><div class="muted">${a.length} lesson${a.length===1?'':'s'}</div></div></div><b style="font:600 20px var(--disp)">${l?esc(l.label.split(' (')[0]):'Not started'}</b>${spark(a.slice(-10).map(x=>lvOf(x)/mxl))}</section>`;}).join('')}</div>
  <section class="card bars"><h3>Most common mistakes</h3>${top.length?top.map(([k,n])=>`<div class="row"><span>${esc(cap(k))}</span><div class="tr"><i style="width:${100*n/mx}%"></i></div><span>${n}</span></div>`).join('')+'<p class="muted">Fix the top one first. It costs you the most marks.</p>':'<p class="muted">No mistake data yet.</p>'}</section>
  <section class="card"><h3>Recent lessons</h3>${hist().slice(-8).reverse().map(x=>`<div class="prow"><div><b>${esc(x.exam)} ${esc(x.skill==='review'?'mistake review':x.skill)}</b><div class="muted">${esc(x.task)}</div></div><div style="text-align:right"><b>${esc(x.label)}</b><div class="muted">${new Date(x.ts).toLocaleDateString()}</div></div></div>`).join('')||'<p class="muted">Nothing yet. Start from the Learn tab.</p>'}</section></div>`;
}
function tabMe(){
  const st=stats(),lvl=Math.floor(st.total/150)+1,e=P.exam,tg=e==='CELPIP'?[5,6,7,8,9,10,11,12]:[5,5.5,6,6.5,7,7.5,8,8.5];

function listenCard(){const it=S.item,can='speechSynthesis' in window;

function qHtml(){const r=S.rl,qs=S.item.qs,q=qs[r.i],a=r.answers[r.i],done=r.checked;let body;

  else body=q.options.map((o,k)=>{let c='opt';if(done){if(k===q.correct)c+=' right';else if(a&&a.a===k)c+=' wrong';}else if(r.sel===k)c+=' sel';return `<button class="${c}" data-act="pick" data-arg="${k}" ${done?'disabled':''}><span class="k">${q.type==='mcq'?'ABCD'[k]:k+1}</span><span>${esc(o)}</span></button>`;}).join('');
  return `<div class="qmeta">Question ${r.i+1} of ${qs.length}</div><div class="qtext">${esc(q.q)}</div>${body}`;}
function abarHtml(){const r=S.rl,qs=S.item.qs,q=qs[r.i];
  if(!r.checked)return `<div class="ab-in"><button class="btn ghost" data-act="skipQ">Skip</button><button class="btn" id="chk" data-act="check" ${r.sel==null||r.sel===''?'disabled':''}>Check</button></div>`;
  const a=r.answers[r.i],last=r.i===qs.length-1;
  const corr=q.type==='fill'?q.display:(q.type==='mcq'?'ABCD'[q.correct]+'. ':'')+q.options[q.correct];
  return `<div class="ab-in"><div class="fb-t">${icf(a.ok?'right':'wrong')}<div><b>${a.ok?rnd(['Correct!','Nice one!','Spot on!','Well done!']):a.a==null?'Skipped':'Not quite'}</b><span class="tx">${a.ok?'':'Answer: '+esc(corr)+'. '}${esc(q.why)}</span><span class="tag">${esc(q.skill)}</span></div></div><button class="btn" data-act="next">${last?'Finish':'Continue'}</button></div>`;}
function viewRL(){const sk=S.skill,it=S.item,r=S.rl;
  const left=sk==='reading'?`<div class="pcard"><h2>${esc(it.title||'Passage')}</h2><div class="passage">${esc(it.passage)}</div></div>`:listenCard();
  return `<div class="lesson" data-skill="${sk}">${lessonHead(sk==='reading',0)}${S.note?`<div class="note">${esc(S.note)}</div>`:''}
  <div class="seg"><button data-act="pane" data-arg="p" class="${r.pane==='p'?'on':''}">${sk==='reading'?'Passage':'Audio'}</button><button data-act="pane" data-arg="q" class="${r.pane==='q'?'on':''}">Questions</button></div>
  <div class="lsplit" id="lsp" data-pane="${r.pane}"><section class="ppane">${left}</section><section class="qpane" id="qpane">${qHtml()}</section></div>
  <div class="abar" id="abar">${abarHtml()}</div></div>`;}
function paintQ(){const r=S.rl,n=S.item.qs.length;
  $('#qpane').innerHTML=qHtml();const ab=$('#abar');ab.className='abar'+(r.checked?(r.answers[r.i].ok?' ok':' no'):'');ab.innerHTML=abarHtml();
  const pb=$('#pb');if(pb)pb.style.width=(100*(r.i+(r.checked?1:0))/n)+'%';
  const f=$('#fillin');if(f&&!r.checked)f.focus({preventScroll:true});}

/* ---------- views: results ---------- */
function ring(f,big,small){const C=2*Math.PI*52,d=Math.max(0,Math.min(1,f))*C;return `<div class="ring2"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="r0"/><circle cx="60" cy="60" r="52" class="r1" stroke-dasharray="${d.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/></svg><div class="sc"><b>${esc(big)}</b><span>${esc(small)}</span></div></div>`;}
function viewResult(){
  const r=S.result,g=S.gain||{xp:0},sk=S.skill;
  if(r.kind==='mr')return `<div class="res" data-skill="writing"><div class="cele">${bandy('cheer',150)}<h1>Mistakes reviewed</h1><p class="sub">${r.got} of ${r.total} corrections now feel solid.</p></div><div class="tiles" style="grid-template-columns:repeat(2,1fr)"><div class="tile t-xp"><div class="th">XP earned</div><div class="tv">${icf('bolt')}+${g.xp}</div></div><div class="tile t-ac"><div class="th">Got it</div><div class="tv">${r.got}/${r.total}</div></div></div>${bannerHtml(g)}<div class="abar"><div class="ab-in"><span></span><button class="btn" data-act="home">Continue</button></div></div></div>`;
  const tg=P.target[P.exam],lv=r.lv!=null?r.lv:r.overall,good=lv>=tg,near=lv>=tg-1;
  const mood=good?'cheer':near?'happy':'think';
  const head=good?'You hit your target!':near?'Nice work. Almost there.':'Good practice. Keep going.';
  const third=r.kind==='rl'?`<div class="tile t-ac"><div class="th">Accuracy</div><div class="tv">${r.pct}%</div></div>`:`<div class="tile t-ac"><div class="th">${sk==='writing'?'Words':'Words spoken'}</div><div class="tv">${(r.meta&&r.meta.words)||0}</div></div>`;
  let detail;
  if(r.kind==='rl')detail=resRL(r);else detail=resWS(r);
  return `<div class="res" data-skill="${sk}"><div class="cele">${bandy(mood,150)}<h1>${head}</h1><p class="sub">Estimated ${esc(lbl(P.exam,lv))}. Your target is ${esc(lbl(P.exam,tg))}.</p></div>
  <div class="tiles"><div class="tile t-xp"><div class="th">XP earned</div><div class="tv">${icf('bolt')}+${g.xp}</div></div><div class="tile t-lv"><div class="th">${P.exam==='CELPIP'?'Level':'Band'}</div><div class="tv">${esc(lv)}</div></div>${third}</div>
  ${bannerHtml(g)}${detail}
  <div class="abar"><div class="ab-in"><button class="btn ghost" data-act="again">Try another</button><button class="btn" data-act="home">Continue</button></div></div></div>`;
}
function bannerHtml(g){let h='';
  if(g.streakUp)h+=`<div class="banner">${icf('flame','fl')}<div><b>${g.streak} day streak</b><div class="muted">You practised today. Come back tomorrow to keep it going.</div></div></div>`;
  if(g.goalHit)h+=`<div class="banner" style="border-color:color-mix(in srgb,var(--gold) 60%,transparent);background:color-mix(in srgb,var(--gold) 14%,var(--surface))">${icf('star','gd')}<div><b>Daily goal reached</b><div class="muted">${P.goal} XP done for today.</div></div></div>`;
  return h;}
function resRL(r){const it=S.item,qs=it.qs,misses=Object.entries(r.miss).sort((a,b)=>b[1]-a[1]);
  return `<section class="card"><h3>${misses.length?'Where you lost marks':'Clean sheet'}</h3>${misses.length?misses.map(([k,n])=>`<div class="miss"><b>${esc(cap(k))}</b> (${n} missed)<br><span class="muted">${esc(TIPS[k]||'Find the exact sentence that proves the answer, then check why your choice fails.')}</span></div>`).join(''):'<p>Every answer was right. Try a harder part next.</p>'}</section>
  <section class="card"><h3>Question review</h3>${qs.map((q,i)=>{const x=r.res[i];const yours=x.a==null||x.a===''?'No answer':q.type==='fill'?x.a:(q.type==='mcq'?'ABCD'[x.a]+'. ':'')+q.options[x.a];const corr=q.type==='fill'?q.display:(q.type==='mcq'?'ABCD'[q.correct]+'. ':'')+q.options[q.correct];
    return `<div class="qrev"><div><b>${i+1}. ${esc(q.q)}</b> <span class="${x.ok?'ok':'no'}">${x.ok?'Correct':'Wrong'}</span></div><div class="muted">Your answer: ${esc(yours)}${x.ok?'':` · Correct: <b>${esc(corr)}</b>`}</div><div>${esc(q.why)}</div></div>`;}).join('')}</section>
  ${S.skill==='listening'?`<details class="card"><summary>Script</summary><div class="passage">${esc(it.script.map(s=>s.speaker+': '+s.text).join('\n'))}</div></details>`:''}`;}
function resWS(r){const max=maxLv(),m=r.meta||{};const tab=S.rtab;
  const tc=countTypes(r.errors.map(e=>e.type||'error'));
  const tabs=[['scores','Scores'],['mistakes','Mistakes'],['improve','Improve'],['model','Model']];
  let c='';
  if(tab==='scores')c=`<section class="card" style="align-items:stretch">${ring(r.overall/max,String(r.overall),'of '+max)}<p style="text-align:center">${esc(r.summary)}</p><p class="muted" style="text-align:center">Unofficial estimate. Examiners can differ by about one ${P.exam==='CELPIP'?'level':'half band'}.</p></section>
  <section class="card"><h3>Scores by criterion</h3>${r.criteria.map(x=>`<div class="crit"><div class="h"><span>${esc(x.name)}</span><span>${x.score==null?'Not assessed':esc(x.score)+' / '+(x.max||max)}</span></div>${x.score==null?'':`<div class="bar2"><i style="width:${Math.max(0,Math.min(100,100*x.score/(x.max||max)))}%"></i></div>`}<div class="muted">${esc(x.comment)}</div></div>`).join('')}${S.skill==='speaking'?'<p class="muted">Pronunciation, accent and intonation are not assessed. Gap counts come from speech-to-text timing and are only a rough guide.</p>':''}</section>
  ${r.strengths.length?`<section class="card"><h3>What worked</h3>${r.strengths.map(s=>`<div class="good">${esc(s)}</div>`).join('')}</section>`:''}`;
  else if(tab==='mistakes')c=`<section class="card"><h3>Your mistakes</h3>${r.errors.length?`<div class="counts">${Object.entries(tc).map(([k,n])=>`<span class="cnt">${esc(k)} ${n}</span>`).join('')}</div>`:'<p class="muted">No specific errors were flagged.</p>'}</section>${r.errors.map(e=>`<div class="err"><div class="t">${esc(e.type||'error')}</div><div class="bad">${esc(e.quote)}</div><div class="fix">${esc(e.fix)}</div><div class="muted">${esc(e.why)}</div></div>`).join('')}`;
  else if(tab==='improve')c=`<section class="card"><h3>Fix these first</h3>${r.priorities.length?`<ol class="steps">${r.priorities.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>`:'<p class="muted">No priorities returned.</p>'}</section>${r.drills.map(d=>`<div class="drill"><h3>${esc(d.title)}</h3><ul class="steps">${(d.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`).join('')}`;
  else c=`<section class="card"><h3>Model answer</h3><div class="prompt">${esc(r.model)}</div></section><details class="card"><summary>Your answer</summary><div class="prompt">${esc(S.skill==='writing'?m.text:(m.speaking||[]).map((a,i)=>'Q'+(i+1)+': '+a.text).join('\n\n'))}</div></details>`;
  const stats=S.skill==='speaking'&&tab==='scores'?`<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${(m.speaking||[]).map((a,i)=>`<div class="tile" style="--c0:var(--line)"><div class="th" style="color:var(--ink)">Q${i+1}</div><div class="tv" style="font-size:20px">${a.secs}s / ${a.limit}s</div><div class="muted" style="padding-bottom:8px">${a.wpm} wpm · ${a.pauses} gaps</div></div>`).join('')}</div>`:'';
  return `<div class="tabs" role="tablist">${tabs.map(([k,n])=>`<button class="${tab===k?'on':''}" data-act="rtab" data-arg="${k}">${n}</button>`).join('')}</div>${stats}${c}`;}
function countTypes(a){const o={};a.forEach(t=>{o[t]=(o[t]||0)+1;});return o;}

/* ---------- views: mistake review ---------- */
function mistakeItems(){const seen=new Set(),out=[];hist().slice().reverse().forEach(x=>(x.mk||[]).forEach(m=>{if(m&&m.q&&!seen.has(m.q)){seen.add(m.q);out.push(m);}}));return out.slice(0,40);}
function viewMistakes(){const m=S.mr,it=m.items[m.i];
  return `<div class="lesson" data-skill="writing" style="padding-bottom:60px">${lessonHead(false,100*m.i/m.items.length)}<div class="spk"><div class="muted" style="text-align:center">Card ${m.i+1} of ${m.items.length}</div>
  <section class="card fc"><span class="chip" style="align-self:center">${esc(it.t||'mistake')}</span><div class="q" style="text-decoration:line-through;text-decoration-color:var(--bad);color:var(--mut)">${esc(it.q)}</div>
  ${m.show?`<div class="fix good" style="font-weight:800">${esc(it.f)}</div><div class="muted">${esc(it.w||'')}</div>`:'<p class="muted">How would you fix this?</p>'}</section>
  ${m.show?`<div style="display:flex;gap:12px;justify-content:center"><button class="btn ghost" data-act="mrNo">Still tricky</button><button class="btn" data-act="mrYes">Got it</button></div>`:`<div style="text-align:center"><button class="btn" data-act="mrShow">Show the fix</button></div>`}</div></div>`;}

/* ---------- render ---------- */
function render(scroll){
  document.documentElement.dataset.exam=P.exam;
  const v=S.view;let h;
  if(!P.onboarded)h=viewOnboard();
  else if(v==='lesson')h=viewLesson();
  else if(v==='mistakes')h=viewMistakes();
  else if(v==='result')h=viewResult();
  else h=viewShell();
  $('#app').innerHTML=h;
  if(scroll)window.scrollTo(0,0);
  if(P.onboarded&&v==='home'){paintCap();if(S.focusNext){S.focusNext=false;const n=$('.node.next');if(n&&n.scrollIntoView)n.scrollIntoView({block:'center'});}}
  if(v==='result'&&S.fx){S.fx=false;const r=S.result;const ok=r.kind==='mr'||(r.pct!=null?r.pct>=50:r.overall>=P.target[P.exam]-2);if(ok){confetti(r.kind==='mr'?90:(r.lv>=P.target[P.exam]?200:110));tone(SND.done);}}
}
function leave(){stopTimer();stopSpeech();if(dict){try{dict.stop();}catch(e){}}S.sp=null;S.rl=null;think(null);}

/* ---------- lesson control ---------- */
async function startTask(sk,id){
  const task=getTasks(sk).find(t=>t.id===id);if(!task)return;
  closeSheet();S.skill=sk;S.task=task;S.played=false;S.note='';stopSpeech();
  think(['Writing your question','Choosing a topic','Checking the difficulty']);
  let item;
  try{item=await generate(task);if(sk==='reading'||sk==='listening')item=prepRL(item);}
  catch(e){item=fallback(task);if(sk==='reading'||sk==='listening')item=prepRL(item);
    S.note=e&&e.code==='nosample'?'Using a built-in question. Open this page in Claude for fresh ones.':e&&e.code==='not_granted'?'Permission to use Claude was declined, so this question comes from the built-in bank.':'Could not write a fresh question, so this one is from the built-in bank.';}
  think(null);S.item=item;S.view='lesson';
  if(sk==='speaking'){const e=P.exam;const st=e==='CELPIP'?[{prompt:item.prompts[0],prep:task.prep,speak:task.speak}]:item.prompts.slice(0,task.n).map(p=>({prompt:p,prep:task.steps[0],speak:task.steps[1]}));
    S.sp={steps:st,i:0,answers:[],phase:st[0].prep?'prep':'ready'};}
  if(sk==='reading'||sk==='listening')S.rl={i:0,sel:null,checked:false,answers:[],pane:'q'};
  render(true);
  if(sk==='writing')startTimer(task.min*60,'#tm',()=>{const v=$('#wr')?$('#wr').value:'';if(words(v)>=5)gradeWriting(v);else{infoSheet('Time is up','You did not write enough to grade. Try again when you are ready.');A.home();}});
  if(sk==='reading')startTimer(task.min*60,'#tm',()=>finishRL());
  if(sk==='speaking'&&S.sp.phase==='prep')startTimer(S.sp.steps[0].prep,'#tm',()=>{S.sp.phase='ready';render();});
}
function act(){const sp=S.sp;if(!sp)return;const n=Date.now();if(sp.latency==null)sp.latency=(n-sp.t0)/1000;else if(n-sp.last>2500)sp.pauses++;sp.last=n;}

/* ---------- grading ---------- */
function rubric(){
  const e=P.exam,sk=S.skill;
  if(e==='CELPIP')return sk==='writing'?'CELPIP Writing, 4 criteria each scored 1-12 (CELPIP level): "Content/Coherence", "Vocabulary", "Readability" (grammar, spelling, punctuation, paragraphing), "Task Fulfillment". Overall = average, rounded to a whole level 1-12.':'CELPIP Speaking, 4 criteria each scored 1-12: "Content/Coherence", "Vocabulary", "Listenability" (as inferable from the transcript only), "Task Fulfillment". Overall = average, rounded to a whole level 1-12.';
  return sk==='writing'?'IELTS Writing bands 0-9 in half-bands: "Task Achievement/Response", "Coherence and Cohesion", "Lexical Resource", "Grammatical Range and Accuracy". Overall = average rounded to nearest half band (Task 2 counts more in real life; mention if under the word limit).':'IELTS Speaking bands 0-9 in half-bands: "Fluency and Coherence", "Lexical Resource", "Grammatical Range and Accuracy", "Pronunciation". Pronunciation cannot be judged from a transcript: set its score to null and say so; average only the other three.';
}
const OUT='Return ONLY JSON: {"overall":number,"criteria":[{"name":string,"score":number|null,"max":number,"comment":string}],"strengths":[string],"errors":[{"quote":string (EXACT substring from the candidate text),"type":"grammar"|"vocabulary"|"spelling"|"punctuation"|"coherence"|"task"|"style"|"fluency","fix":string (corrected version),"why":string (short rule or reason)}],"priorities":[string (top 3 things to improve, most important first)],"drills":[{"title":string,"steps":[string]}] (2-3 specific drills targeting THIS candidate\'s errors),"model_answer":string (a strong answer at the candidate\'s target level, same task),"summary":string (2 sentences)}. List up to 10 of the most important errors; prefer errors that repeat or cost the most marks.';
function record(o){
  const before=stats();const xp=o.base+Math.round(Math.max(0,Math.min(100,o.pct))/100*20);
  addHist({ts:Date.now(),exam:P.exam,module:P.module,skill:o.skill||S.skill,taskId:S.task&&S.task.id,task:o.task||(S.task&&S.task.name),score:o.score,lv:o.lv,label:o.label,xp,err:o.err||{},mk:o.mk||[]});
  const after=stats();S.gain={xp,streak:after.streak,streakUp:!before.doneToday,goalHit:before.today<P.goal&&after.today>=P.goal};
}
function normRes(r,meta){const o=Number(r.overall);const v=isFinite(o)?o:0;return {kind:'ws',overall:v,lv:v,label:lbl(P.exam,isFinite(o)?o:'?'),criteria:Array.isArray(r.criteria)?r.criteria:[],strengths:r.strengths||[],errors:(r.errors||[]).filter(e=>e&&e.quote),priorities:r.priorities||[],drills:r.drills||[],model:r.model_answer||'',summary:r.summary||'',meta};}
async function runGrade(prompt,meta){
  think(['Reading your answer','Checking grammar and vocabulary','Comparing with the exam criteria','Writing your feedback']);
  try{const r=await askJSON(prompt,{modelTier:'default'});const res=normRes(r,meta);S.result=res;
    record({pct:100*res.overall/maxLv(),base:20,score:res.overall,lv:res.overall,label:res.label,err:countTypes(res.errors.map(e=>e.type||'error')),mk:res.errors.slice(0,5).map(e=>({q:e.quote,f:e.fix,w:e.why,t:e.type}))});
    S.view='result';S.rtab='scores';S.fx=true;}
  catch(e){think(null);infoSheet('Grading did not finish',e&&e.code==='not_granted'?'Grading needs permission to use Claude. Submit again and allow it.':e&&e.code==='nosample'?'Grading works when this page is open in Claude.':'The reply could not be read. Your answer is still here, so submit it again.');
    if(S.skill==='speaking'&&S.sp){S.sp.answers.pop();S.sp.phase='speak';}return;}
  think(null);render(true);
}
function gradeWriting(text){
  const t=S.task,it=S.item,wc=words(text);stopTimer();
  runGrade(`You are a strict, fair certified ${P.exam} ${S.skill} examiner. Grade this candidate's answer using ${rubric()}\nBe realistic: do not inflate. Penalise being under the word target (${t.words[0]}+), off-topic content, memorised templates, and repeated errors. Remember this is an unofficial estimate.\n\nTASK (${P.exam}${P.exam==='IELTS'?' '+P.module:''}, ${t.name}):\n${it.prompt}\n${it.data?'DATA:\n'+it.data+'\n':''}\nCANDIDATE ANSWER (${wc} words, written in ${t.min} minutes allowed):\n"""\n${text}\n"""\n\n${OUT}`,{words:wc,text});
}
function gradeSpeaking(){
  const sp=S.sp,total=sp.answers.reduce((a,x)=>a+x.words,0);
  const blocks=sp.answers.map((a,i)=>`Q${i+1}: ${a.prompt}\nTime used: ${a.secs}s of ${a.limit}s · words: ${a.words} · speed: ${a.wpm} wpm · hesitation gaps over 2.5s: ${a.pauses}${a.latency!=null?' · first words after '+a.latency+'s':''}\nTRANSCRIPT: """${a.text||'(no answer)'}"""`).join('\n\n');
  runGrade(`You are a strict, fair certified ${P.exam} speaking examiner. You only have a speech-to-text transcript (which usually removes fillers and corrects some slips) plus rough timing data. Grade using ${rubric()}\nUse the timing data for fluency (very short answers, long gaps, or very slow/fast speed matter) but state clearly that pronunciation, intonation and accent could not be assessed. Do not inflate scores; blank or one-line answers score very low. Remember this is an unofficial estimate.\n\nTASK (${P.exam}${P.exam==='IELTS'?' '+P.module:''}, ${S.task.name}):\n${blocks}\n\n${OUT}\nFor "quote" copy exact words from a transcript. For "model_answer" give a strong spoken-style answer to the first question (natural, not essay-like).`,{speaking:sp.answers,words:total});
}
function finishRL(){
  if(S.view!=='lesson'||!S.rl)return;stopTimer();stopSpeech();
  const it=S.item,qs=it.qs,r=S.rl;
  const res=qs.map((q,i)=>r.answers[i]||{ok:false,a:null});
  const right=res.filter(x=>x.ok).length,pct=Math.round(100*right/qs.length);
  const miss={};res.forEach((x,j)=>{if(!x.ok)miss[qs[j].skill]=(miss[qs[j].skill]||0)+1;});
  const lv=pctNum(pct,P.exam),label=lbl(P.exam,lv);
  S.result={kind:'rl',right,total:qs.length,pct,lv,label,res,miss,overall:pct};
  record({pct,base:10,score:pct,lv,label:label+' ('+right+'/'+qs.length+')',err:miss});
  S.view='result';S.fx=true;S.rl=null;render(true);
}

/* ---------- actions ---------- */
const A={
  tab:v=>{leave();closeSheet();S.tab=v;S.view='home';render(true);},
  home:()=>{leave();closeSheet();S.view='home';S.tab='learn';S.focusNext=true;render(true);},
  course:()=>courseSheet(),
  setCourse:v=>{const[e,m]=v.split(':');P.exam=e;if(m)P.module=m;saveP();closeSheet();render();},
  open:v=>{const[sk,id]=v.split(':');const t=getTasks(sk).find(x=>x.id===id);if(t)startSheet(sk,t);},
  start:v=>{const[sk,id]=v.split(':');startTask(sk,id);},
  quick:sk=>startTask(sk,rnd(getTasks(sk)).id),
  surprise:()=>{const sk=rnd(SKL);startTask(sk,rnd(getTasks(sk)).id);},
  tips:sk=>tipsSheet(sk),
  scrim:(a,b,e)=>{if(e.target===b)closeSheet();},
  closeSheet:()=>closeSheet(),
  quit:()=>showSheet(`<div class="sheet" role="dialog" aria-modal="true"><h2>Quit this lesson?</h2><p>Your progress in this lesson will be lost.</p><button class="btn block" data-act="closeSheet">Keep going</button><button class="btn ghost block" data-act="home">Quit lesson</button></div>`),

 mk(`${say("This is the CELPIP mock exam. I am your examiner. Please confirm your full name before we begin.")}<div style="${CARD}"><input id="mn" value="${esc(M.name)}" placeholder="Full name" style="${INP}"><p style="font-weight:800;margin:16px 0 6px">Which part will you sit?</p>${[['all','Full test (all four parts, about 3 hours)'],...SEC.map(s=>[s,NAME[s]+' only'])].map(([v,n],i)=>`<label style="display:block;padding:8px 0"><input type="radio" name="ms" value="${v}" ${i?'':'checked'}> ${n}</label>`).join('')}</div>${btn('mockRules','Continue')}${btn('mockExit','Back to Bandwise',1)}`);};
window.mockRules=function(){const n=($('#mn')||{}).value||'';if(!n.trim()){$('#mn').focus();return;}M.name=n.trim();P.name=M.name;saveP();
 const v=(document.querySelector('input[name=ms]:checked')||{}).value||'all';M.secs=v==='all'?SEC:[v];
 mk(`${say(`Thank you, ${esc(M.name)}. Please listen carefully to the exam rules.`)}<div style="${CARD}"><ol style="line-height:1.8;padding-left:22px;margin:0"><li>Every part is timed. When time ends, your answers are submitted automatically.</li><li>You cannot go back or pause once a part begins.</li><li>Listening recordings play <b>once only</b>.</li><li>Pasting is disabled. Work alone, with no notes or dictionary.</li><li>Leaving this page is recorded and reported in your results.</li><li>You will get no feedback until the exam is finished.</li></ol></div>${btn('mockGo','I understand. Start the exam')}${btn('mockExit','Cancel',1)}`);};
window.mockGo=function(){const ex=P.exam;P.exam='CELPIP';M.q=[];M.res={};
 M.secs.forEach(sk=>{S.skill=sk;getTasks(sk).forEach((t,k)=>{S.task=t;let it=fallback(t);if(sk==='reading'||sk==='listening')it=prepRL(it);M.q.push({sk,t,it,first:k===0});});});
 P.exam=ex;saveP();M.i=0;M.intro=false;show();};
function show(){stopTimer();stopSpeech();if(M.i>=M.q.length)return results();const q=M.q[M.i],n=M.q.filter(x=>x.sk===q.sk);const pos=n.indexOf(q)+1;
 if(q.first&&!M.intro){M.intro=true;const rule={listening:'Each recording plays once. Answer the questions that follow.',reading:'Read the text and answer all questions before time runs out.',writing:'Write your response in the box. Spellcheck is off.',speaking:'You will have preparation time, then speak. Your answer is captured once.'}[q.sk];
  return mk(`${say(`${NAME[q.sk]} section. ${n.length} parts. ${rule}`)}${btn('mockPart','Begin '+NAME[q.sk]+' section')}`);}
 M.intro=false;M.ph=0;part(q,pos,n.length);}
window.mockPart=function(){M.intro=true;part(M.q[M.i],M.q.filter(x=>x.sk===M.q[M.i].sk).indexOf(M.q[M.i])+1,M.q.filter(x=>x.sk===M.q[M.i].sk).length);};
function forms(qs){return qs.map((q,k)=>`<div style="${CARD}"><b>${k+1}. ${esc(q.q)}</b>${q.type==='fill'?`<input id="f${k}" style="${INP};margin-top:8px" autocomplete="off" placeholder="Your answer">`:q.options.map((o,j)=>`<label style="display:block;padding:6px 0"><input type="radio" name="q${k}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('');}
function score(q){const qs=q.it.qs;let ok=0;qs.forEach((x,k)=>{if(x.type==='fill'){if(x.accept.includes(norm(($('#f'+k)||{}).value||'')))ok++;}else{const r=document.querySelector(`input[name=q${k}]:checked`);if(r&&Number(r.value)===x.correct)ok++;}});return {ok,n:qs.length};}
function done(r){stopTimer();stopSpeech();try{rec&&rec.stop();}catch(e){}(M.res[M.q[M.i].sk]=M.res[M.q[M.i].sk]||[]).push(r);M.i++;M.intro=false;show();}
function part(q,pos,tot){speakEx(NAME[q.sk]+', part '+pos+' of '+tot);const l=`${NAME[q.sk]} · Part ${pos} of ${tot}`,t=q.t;
 const nopaste=`onpaste="return false" ondrop="return false" spellcheck="false" autocomplete="off" autocorrect="off"`;
 const submit=()=>{M.fin=()=>{if(M.busy)return;if(q.sk==='speaking'&&RECX.on){M.busy=true;const ph=$('#ph');if(ph)ph.textContent='Transcribing…';RECX.stop().then(tx=>{M.busy=false;const x=$('#mx');if(x&&tx)x.value=((x.value||'')+' '+tx).trim();done({p:q.it.prompt,x:(x||{}).value||''});});return;}done(q.sk==='reading'||q.sk==='listening'?score(q):{p:q.it.prompt,x:($('#mx')||{}).value||''});};};
 if(q.sk==='reading'){mk(`${bar(l)}<div style="${CARD};white-space:pre-wrap;line-height:1.6"><b>${esc(q.it.title||'')}</b>\n\n${esc(q.it.passage)}</div>${forms(q.it.qs)}${btn('mockSub','Submit part')}`);submit();startTimer(t.min*60,'#mt',()=>M.fin());}
 else if(q.sk==='listening'){mk(`${bar(l)}<div style="${CARD}"><b>${esc(t.name)}</b><p>The recording plays once. You cannot replay it.</p><button class="btn block" id="pl" data-act="mockPlay">Play recording</button></div><div id="lq"></div>`);M.cur=q;submit();}
 else if(q.sk==='writing'){mk(`${bar(l)}<div style="${CARD};white-space:pre-wrap">${esc(q.it.prompt)}</div><textarea id="mx" ${nopaste} style="${INP};min-height:300px"></textarea><div id="wc" class="muted" style="margin:6px 0">0 words · Minimum ${t.words[0]}</div>${btn('mockSub','Submit response')}`);
  $('#mx').oninput=()=>{$('#wc').textContent=words($('#mx').value)+' words · Minimum '+t.words[0];};submit();startTimer(t.min*60,'#mt',()=>M.fin());}
 else{const p=q.it.prompts[0];mk(`${bar(l)}<div style="${CARD};white-space:pre-wrap">${esc(p)}</div><p id="ph" style="font-weight:800">Preparation time</p><textarea id="mx" disabled ${nopaste} placeholder="Your spoken answer is captured here. If your microphone is unavailable, type it." style="${INP};min-height:140px"></textarea><div id="sb">${btn('mockSub','Finish answer')}</div>`);$('#sb').hidden=true;
  q.it.prompt=p;submit();startTimer(t.prep,'#mt',()=>{$('#ph').textContent='Speak now';const x=$('#mx');x.disabled=false;x.focus();$('#sb').hidden=false;
   if(SR&&!SAF){try{rec=new SR();rec.lang='en-CA';rec.continuous=true;rec.interimResults=false;rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)x.value+=(x.value?' ':'')+e.results[i][0].transcript;};rec.onend=()=>{if(M&&M.fin&&!x.disabled&&document.body.contains(x)){try{rec.start();}catch(e){}}};rec.start();}catch(e){}}else if(RECX.ok){RECX.start().catch(()=>{});}
   startTimer(t.speak,'#mt',()=>M.fin());});}}
window.mockSub=()=>{if(M&&M.fin)M.fin();};
window.mockPlay=function(){const q=M.cur,b=$('#pl');b.disabled=true;b.textContent='Playing… (once only)';
 const after=()=>{b.textContent='Recording finished';$('#lq').innerHTML=forms(q.it.qs)+btn('mockSub','Submit part');startTimer(120,'#mt',()=>M.fin());};
 if(!speakScript(q.it.script,after)){$('#lq').innerHTML=`<div style="${CARD}"><b>Audio is not supported in this browser. Transcript:</b><p style="white-space:pre-wrap">${q.it.script.map(s=>esc(s.speaker+': '+s.text)).join('\n')}</p></div>`+forms(q.it.qs)+btn('mockSub','Submit part');startTimer(240,'#mt',()=>M.fin());}};
async function results(){mk(`${say(`Thank you, ${esc(M.name)}. The exam is finished. Your responses are being marked.`)}`);const out={};
 for(const sk of M.secs){const rs=M.res[sk]||[];if(sk==='reading'||sk==='listening'){const ok=rs.reduce((a,r)=>a+r.ok,0),n=rs.reduce((a,r)=>a+r.n,0)||1;out[sk]={lv:lvl(100*ok/n),note:`${ok} of ${n} correct`};}
  else{const ls=(await Promise.all(rs.map(async r=>{if(words(r.x)<5)return 0;try{const j=await askJSON(`You are a strict CELPIP examiner. Mark this ${sk} response on the official CELPIP scale (1 to 12) using content and coherence, vocabulary, ${sk==='writing'?'readability':'listenability'} and task fulfilment. Be strict: off-topic or too short answers score low.\nTask: ${r.p}\nResponse: ${r.x}\nReturn ONLY JSON {"level":number,"comment":"one sentence"}`);return Math.max(1,Math.min(12,Number(j.level)||1));}catch(e){return null;}}))).filter(x=>x!=null);
   out[sk]=ls.length?{lv:Math.round(ls.reduce((a,b)=>a+b,0)/ls.length),note:`${ls.length} of ${rs.length} responses marked`}:{lv:null,note:'Marking needs Claude. Open this page inside Claude.'};}}
 const v=Object.values(out).map(x=>x.lv).filter(x=>x!=null),ov=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null,tg=P.target.CELPIP;
 mk(`${say(ov==null?'Here is your report.':ov>=tg?`Well done, ${esc(M.name)}. You reached your target.`:`Thank you, ${esc(M.name)}. You are not at your target of Level ${tg} yet. Keep practising.`)}<div style="${CARD}"><h2 style="margin:0 0 8px">Candidate: ${esc(M.name)}</h2>${M.secs.map(s=>`<p style="display:flex;justify-content:space-between;margin:8px 0"><span><b>${NAME[s]}</b> <small class="muted">${esc(out[s].note)}</small></span><b>${out[s].lv==null?'-':'Level '+out[s].lv}</b></p>`).join('')}${ov!=null&&M.secs.length>1?`<hr><p style="display:flex;justify-content:space-between"><b>Overall (estimate)</b><b>Level ${ov}</b></p>`:''}<p class="muted">Times you left the exam page: ${M.strikes}</p></div>${btn('mockExit','Finish')}`);}
window.mockExit=function(){if(M&&M.q&&M.i<M.q.length&&!confirm('Leaving ends the exam and your answers will not be saved. Leave?'))return;close();};
document.addEventListener('visibilitychange',()=>{if(M&&M.q&&document.hidden)M.strikes++;});
Object.assign(A,{mock:mockStart,mockRules,mockGo,mockPart,mockSub,mockPlay,mockExit});
const tl=tabLearn;tabLearn=function(){return `<div style="${CARD};display:flex;gap:12px;align-items:center;border-color:var(--brand)"><div style="flex:1"><b>CELPIP Mock Exam</b><div class="muted" style="font-size:13px">Strict, timed, no feedback until the end</div></div><button class="btn" data-act="mock">Take exam</button></div>`+tl();};
render();
})();

/* ---- spoken examiner voice ---- */
var VX={unlocked:false,pending:'',key:''};
function plain(h){const d=document.createElement('div');d.innerHTML=String(h);return (d.textContent||'').replace(/\s+/g,' ').trim();}
function bestVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return null;
 const sc=v=>(/natural|neural|online/i.test(v.name)?50:0)+(/google/i.test(v.name)?30:0)+(/premium|enhanced|samantha|ava|allison|serena|aria|jenny|sonia|libby|karen|daniel/i.test(v.name)?25:0)+(/en-(CA|GB|AU|US)/i.test(v.lang)?5:0)-(/compact|espeak/i.test(v.name)?30:0);
 return vs.slice().sort((a,b)=>sc(b)-sc(a))[0];}
function speakEx(text){if(!text||P.voice===false||!window.speechSynthesis)return;
 if(!VX.unlocked){VX.pending=text;return;}
 try{speechSynthesis.cancel();const v=bestVoice();(String(text).match(/[^.!?:]+[.!?:]*/g)||[text]).forEach(sn=>{const s=sn.trim();if(!s)return;const u=new SpeechSynthesisUtterance(s);if(v){u.voice=v;u.lang=v.lang;}else u.lang='en-US';u.rate=.93;u.pitch=1;speechSynthesis.speak(u);});}catch(e){}}
document.addEventListener('pointerdown',()=>{if(!VX.unlocked){VX.unlocked=true;if(VX.pending){const t=VX.pending;VX.pending='';speakEx(t);}}},{capture:true});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='vox'){P.voice=e.target.checked;saveP();if(!P.voice)try{speechSynthesis.cancel();}catch(x){}}});
const _vo=viewOnboard;viewOnboard=function(){const h=_vo();const d=document.createElement('div');d.innerHTML=h;const li=[...d.querySelectorAll('li')].map(x=>x.textContent).join('. ');const t=((d.querySelector('.bubble')||{}).textContent||'')+' '+li;const k=S.ob.step+'|'+P.exam;if(k!==VX.key){VX.key=k;speakEx(t);}return h;};
const _ss=startSheet;startSheet=function(sk,t){_ss(sk,t);const li=[...document.querySelectorAll('#layer .sheet li')].map(x=>x.textContent).join(' ');speakEx("Examiner's instructions. "+li);};
/* ---- voice input: browser recognition (Chrome/Edge) or recording + server transcription (Safari/Firefox) ---- */
var SAF=/^((?!chrome|chromium|android|crios|fxios).)*safari/i.test(navigator.userAgent);
var RECX={on:false,rec:null,chunks:[],stream:null,ok:!!(window.MediaRecorder&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)};
RECX.start=async function(){const st=await navigator.mediaDevices.getUserMedia({audio:true});RECX.stream=st;
 const mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
 const r=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:32000}:{});RECX.chunks=[];r.ondataavailable=e=>{if(e.data&&e.data.size)RECX.chunks.push(e.data);};r.start(1000);RECX.rec=r;RECX.on=true;};
RECX.stop=function(skip){return new Promise(res=>{const r=RECX.rec;RECX.on=false;const off=()=>{try{RECX.stream&&RECX.stream.getTracks().forEach(t=>t.stop());}catch(e){}};
 if(!r||r.state==='inactive'){off();return res('');}
 r.onstop=async()=>{off();const blob=new Blob(RECX.chunks,{type:r.mimeType||'audio/mp4'});if(skip||blob.size<2000)return res('');
  try{const b64=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(',')[1]);f.onerror=no;f.readAsDataURL(blob);});
   const resp=await fetch('/api/transcribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({audio:b64,type:blob.type})});
   const d=await resp.json();res((d&&d.text)||'');}catch(e){res('');}};
 try{r.stop();}catch(e){off();res('');}});};
if(!dict){const SRX=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SRX&&!SAF){
 const cb={p:()=>{},f:()=>{},s:()=>{}};let r=null,want=false;
 dict={onPartial:f=>{cb.p=f;},onFinal:f=>{cb.f=f;},onState:f=>{cb.s=f;},
  start(){return new Promise((res,rej)=>{want=true;r=new SRX();r.lang='en-CA';r.continuous=true;r.interimResults=true;
   r.onstart=()=>{cb.s({state:'listening'});res();};
   r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;rej(e);}};
   r.onresult=e=>{let fin='',itm='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else itm+=t;}if(fin.trim())cb.f({text:fin.trim()});else if(itm.trim())cb.p({text:itm.trim()});};
   r.onend=()=>{cb.s({state:'idle'});if(want){try{r.start();}catch(x){}}};
   try{r.start();}catch(x){rej(x);}});},
  stop(){want=false;return new Promise(res=>{if(!r)return res();const t=setTimeout(res,700);r.onend=()=>{clearTimeout(t);cb.s({state:'idle'});res();};try{r.stop();}catch(x){clearTimeout(t);res();}});}};
 }else if(RECX.ok){
 const cb={f:()=>{},s:()=>{}};
 dict={onPartial:()=>{},onFinal:f=>{cb.f=f;},onState:f=>{cb.s=f;},
  start(){return RECX.start().then(()=>cb.s({state:'listening'}));},
  async stop(){const m=$('#mic');if(m&&RECX.on)m.textContent='Transcribing…';const t=await RECX.stop(!S.sp);if(t)cb.f({text:t});cb.s({state:'idle'});}};
 }
 if(dict){
 dict.onPartial(({text})=>{const sp=S.sp,ta=$('#ta');if(!sp||sp.phase!=='speak'||!ta)return;act();ta.value=((sp.base||'')+' '+text).trim();});
 dict.onFinal(({text})=>{const sp=S.sp,ta=$('#ta');if(!sp||sp.phase!=='speak'||!ta)return;act();sp.base=((sp.base||'')+' '+text).trim();ta.value=sp.base;});
 dict.onState(({state})=>{const m=$('#mic');if(m)m.textContent=state==='listening'?'Listening':'Mic off';});
 }}
})();
